<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a56db">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alerta de Energia — BrasilCenter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: #1a56db;
    padding: 20px 20px 24px;
    text-align: center;
    position: relative;
  }

  .header-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .header-logo .icon {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin-top: 2px;
  }

  /* CARD */
  .card {
    background: #fff;
    border-radius: 16px;
    margin: 16px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title .required {
    color: #ef4444;
    font-size: 14px;
  }

  /* RADIO OPCOES */
  .opcoes { display: flex; flex-direction: column; gap: 10px; }

  .opcao {
    position: relative;
    cursor: pointer;
  }

  .opcao input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .opcao-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .opcao-radio {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: all 0.15s;
  }

  .opcao-radio::after {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #1a56db;
    opacity: 0;
    transform: scale(0);
    transition: all 0.15s;
  }

  .opcao-label {
    font-size: 15px;
    font-weight: 500;
    color: #374151;
    line-height: 1.3;
  }

  .opcao-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    flex-shrink: 0;
  }

  /* Estados selecionados */
  .opcao input:checked ~ .opcao-inner {
    border-color: #1a56db;
    background: #eff6ff;
  }

  .opcao input:checked ~ .opcao-inner .opcao-radio {
    border-color: #1a56db;
  }

  .opcao input:checked ~ .opcao-inner .opcao-radio::after {
    opacity: 1;
    transform: scale(1);
  }

  /* Variantes */
  .opcao.queda-impacto input:checked ~ .opcao-inner { border-color: #dc2626; background: #fef2f2; }
  .opcao.queda-impacto input:checked ~ .opcao-inner .opcao-radio { border-color: #dc2626; }
  .opcao.queda-impacto input:checked ~ .opcao-inner .opcao-radio::after { background: #dc2626; }

  .opcao.queda-sem input:checked ~ .opcao-inner { border-color: #f59e0b; background: #fffbeb; }
  .opcao.queda-sem input:checked ~ .opcao-inner .opcao-radio { border-color: #f59e0b; }
  .opcao.queda-sem input:checked ~ .opcao-inner .opcao-radio::after { background: #f59e0b; }

  .opcao.pico-impacto input:checked ~ .opcao-inner { border-color: #dc2626; background: #fef2f2; }
  .opcao.pico-impacto input:checked ~ .opcao-inner .opcao-radio { border-color: #dc2626; }
  .opcao.pico-impacto input:checked ~ .opcao-inner .opcao-radio::after { background: #dc2626; }

  .opcao.pico-sem input:checked ~ .opcao-inner { border-color: #f59e0b; background: #fffbeb; }
  .opcao.pico-sem input:checked ~ .opcao-inner .opcao-radio { border-color: #f59e0b; }
  .opcao.pico-sem input:checked ~ .opcao-inner .opcao-radio::after { background: #f59e0b; }

  .opcao.normalizado input:checked ~ .opcao-inner { border-color: #16a34a; background: #f0fdf4; }
  .opcao.normalizado input:checked ~ .opcao-inner .opcao-radio { border-color: #16a34a; }
  .opcao.normalizado input:checked ~ .opcao-inner .opcao-radio::after { background: #16a34a; }

  .opcao.gerador input:checked ~ .opcao-inner { border-color: #d97706; background: #fffbeb; }
  .opcao.gerador input:checked ~ .opcao-inner .opcao-radio { border-color: #d97706; }
  .opcao.gerador input:checked ~ .opcao-inner .opcao-radio::after { background: #d97706; }

  .opcao.falha-bateria input:checked ~ .opcao-inner { border-color: #dc2626; background: #fef2f2; }
  .opcao.falha-bateria input:checked ~ .opcao-inner .opcao-radio { border-color: #dc2626; }
  .opcao.falha-bateria input:checked ~ .opcao-inner .opcao-radio::after { background: #dc2626; }

  .opcao.falha-gerador input:checked ~ .opcao-inner { border-color: #dc2626; background: #fef2f2; }
  .opcao.falha-gerador input:checked ~ .opcao-inner .opcao-radio { border-color: #dc2626; }
  .opcao.falha-gerador input:checked ~ .opcao-inner .opcao-radio::after { background: #dc2626; }

  /* Badge cores */
  .badge-danger { background: #fee2e2; color: #dc2626; }
  .badge-warn { background: #fef3c7; color: #d97706; }
  .badge-ok { background: #dcfce7; color: #16a34a; }

  /* SITES */
  .sites-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .site-opcao {
    position: relative;
    cursor: pointer;
  }

  .site-opcao input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .site-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 8px;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    transition: all 0.15s;
    cursor: pointer;
    text-align: center;
    min-height: 76px;
  }

  .site-sigla {
    font-size: 22px;
    font-weight: 700;
    color: #6b7280;
    letter-spacing: 1px;
    transition: color 0.15s;
  }

  .site-nome {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 3px;
    transition: color 0.15s;
    font-weight: 500;
  }

  .site-opcao input:checked ~ .site-inner {
    border-color: #1a56db;
    background: #eff6ff;
  }

  .site-opcao input:checked ~ .site-inner .site-sigla { color: #1a56db; }
  .site-opcao input:checked ~ .site-inner .site-nome { color: #3b82f6; }

  /* DATA E HORA */
  .datetime-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input[type="date"],
  input[type="time"],
  textarea {
    width: 100%;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: #1a202c;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="date"]:focus,
  input[type="time"]:focus,
  textarea:focus {
    border-color: #1a56db;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
  }

  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    opacity: 0.6;
  }

  textarea {
    resize: none;
    min-height: 100px;
    line-height: 1.6;
    font-size: 14px;
  }

  textarea::placeholder { color: #9ca3af; }

  /* BOTÃO */
  .btn-wrap { padding: 4px 16px 32px; }

  .btn-enviar {
    width: 100%;
    padding: 16px;
    background: #1a56db;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 12px rgba(26,86,219,0.3);
  }

  .btn-enviar:active { transform: scale(0.98); box-shadow: none; }
  .btn-enviar:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; }

  /* FEEDBACK */
  .feedback {
    display: none;
    margin: 0 16px 16px;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
    font-weight: 500;
  }

  .feedback.success {
    background: #f0fdf4;
    border: 2px solid #86efac;
    color: #16a34a;
    display: block;
  }

  .feedback.error {
    background: #fef2f2;
    border: 2px solid #fca5a5;
    color: #dc2626;
    display: block;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 0 16px 24px;
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="icon">⚡</div>
    <h1>Alerta de Energia</h1>
  </div>
  <p>BrasilCenter — Registro de Ocorrência</p>
</div>

<form id="alertaForm" action="enviar.php" method="POST">

  <!-- OCORRÊNCIA -->
  <div class="card">
    <div class="card-title">
      Tipo de Ocorrência <span class="required">*</span>
    </div>
    <div class="opcoes">
      <label class="opcao queda-impacto">
        <input type="radio" name="ocorrencia" value="Queda de Energia COM impacto" required>
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">Queda de Energia — <strong>com impacto</strong></div>
          <span class="opcao-badge badge-danger">⚠️ Crítico</span>
        </div>
      </label>
      <label class="opcao queda-sem">
        <input type="radio" name="ocorrencia" value="Queda de Energia SEM impacto">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">Queda de Energia — <strong>sem impacto</strong></div>
          <span class="opcao-badge badge-warn">Atenção</span>
        </div>
      </label>
      <label class="opcao pico-impacto">
        <input type="radio" name="ocorrencia" value="Pico de Energia COM impacto">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">Pico de Energia — <strong>com impacto</strong></div>
          <span class="opcao-badge badge-danger">⚠️ Crítico</span>
        </div>
      </label>
      <label class="opcao pico-sem">
        <input type="radio" name="ocorrencia" value="Pico de Energia SEM impacto">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">Pico de Energia — <strong>sem impacto</strong></div>
          <span class="opcao-badge badge-warn">Atenção</span>
        </div>
      </label>
    </div>
  </div>

  <!-- SITE -->
  <div class="card">
    <div class="card-title">
      Site <span class="required">*</span>
    </div>
    <div class="sites-grid">
      <label class="site-opcao">
        <input type="radio" name="site" value="VVA" required>
        <div class="site-inner">
          <div class="site-sigla">VVA</div>
          <div class="site-nome">Vila Velha A</div>
        </div>
      </label>
      <label class="site-opcao">
        <input type="radio" name="site" value="RPO">
        <div class="site-inner">
          <div class="site-sigla">RPO</div>
          <div class="site-nome">Repositório</div>
        </div>
      </label>
      <label class="site-opcao">
        <input type="radio" name="site" value="JFA">
        <div class="site-inner">
          <div class="site-sigla">JFA</div>
          <div class="site-nome">Jardim Fátima</div>
        </div>
      </label>
      <label class="site-opcao">
        <input type="radio" name="site" value="GNA">
        <div class="site-inner">
          <div class="site-sigla">GNA</div>
          <div class="site-nome">Guaranhuns</div>
        </div>
      </label>
    </div>
  </div>

  <!-- DATA E HORA -->
  <div class="card">
    <div class="card-title">
      Início da Ocorrência <span class="required">*</span>
    </div>
    <div class="datetime-grid">
      <div class="field-group">
        <label>Data</label>
        <input type="date" name="data" id="data" required>
      </div>
      <div class="field-group">
        <label>Hora</label>
        <input type="time" name="hora" id="hora" required>
      </div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="card">
    <div class="card-title">
      Status Atual <span class="required">*</span>
    </div>
    <div class="opcoes">
      <label class="opcao normalizado">
        <input type="radio" name="status" value="Normalizado" required>
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">✅ Normalizado</div>
          <span class="opcao-badge badge-ok">Resolvido</span>
        </div>
      </label>
      <label class="opcao gerador">
        <input type="radio" name="status" value="Gerador em funcionamento">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">🔋 Gerador em funcionamento</div>
          <span class="opcao-badge badge-warn">Em curso</span>
        </div>
      </label>
      <label class="opcao falha-bateria">
        <input type="radio" name="status" value="Falha no Banco de Baterias">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">🪫 Falha no Banco de Baterias</div>
          <span class="opcao-badge badge-danger">⚠️ Crítico</span>
        </div>
      </label>
      <label class="opcao falha-gerador">
        <input type="radio" name="status" value="Falha no Gerador">
        <div class="opcao-inner">
          <div class="opcao-radio"></div>
          <div class="opcao-label">⚙️ Falha no Gerador</div>
          <span class="opcao-badge badge-danger">⚠️ Crítico</span>
        </div>
      </label>
    </div>
  </div>

  <!-- OBSERVAÇÃO -->
  <div class="card">
    <div class="card-title">Observação</div>
    <textarea name="observacao" placeholder="Descreva detalhes adicionais sobre a ocorrência (opcional)..."></textarea>
  </div>

  <div class="btn-wrap">
    <button type="submit" class="btn-enviar" id="btnEnviar">
      <span>⚡</span>
      <span>Enviar Alerta</span>
    </button>
  </div>

</form>

<div class="feedback" id="feedback"></div>

<div class="footer">
  BrasilCenter — Sistema de Monitoramento de Energia
</div>

<script>
  // Preencher data e hora atual automaticamente
  const hoje = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('data').value =
    `${hoje.getFullYear()}-${pad(hoje.getMonth()+1)}-${pad(hoje.getDate())}`;
  document.getElementById('hora').value =
    `${pad(hoje.getHours())}:${pad(hoje.getMinutes())}`;

  // Submit via AJAX
  document.getElementById('alertaForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnEnviar');
    const fb = document.getElementById('feedback');

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div><span>Enviando alerta...</span>';
    fb.className = 'feedback';
    fb.style.display = 'none';

    try {
      const formData = new FormData(this);
      const res = await fetch('https://vipofficialstore.com/alerta/enviar.php', { method: 'POST', body: formData });
      const json = await res.json();

      if (json.sucesso) {
        fb.className = 'feedback success';
        fb.innerHTML = '✅ <strong>Alerta enviado com sucesso!</strong><br>A gerência foi notificada via WhatsApp.';
        this.reset();
        document.getElementById('data').value =
          `${hoje.getFullYear()}-${pad(hoje.getMonth()+1)}-${pad(hoje.getDate())}`;
        document.getElementById('hora').value =
          `${pad(hoje.getHours())}:${pad(hoje.getMinutes())}`;
      } else {
        throw new Error(json.erro || 'Erro desconhecido');
      }
    } catch (err) {
      fb.className = 'feedback error';
      fb.innerHTML = `❌ <strong>Falha ao enviar.</strong><br>${err.message}`;
    }

    btn.disabled = false;
    btn.innerHTML = '<span>⚡</span><span>Enviar Alerta</span>';
    fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>

</body>
</html>
